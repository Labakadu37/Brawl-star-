plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jzs.deviceinfo'
    compileSdk 34

    defaultConfig {
        applicationId "com.jzs.deviceinfo"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Load webhook URL from webhook.properties (not committed to git)
        def webhookProps = new Properties()
        def webhookFile = rootProject.file("webhook.properties")
        if (webhookFile.exists()) {
            webhookProps.load(new FileInputStream(webhookFile))
        }
        buildConfigField "String", "WEBHOOK_URL", "\"${webhookProps.getProperty('WEBHOOK_URL', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
