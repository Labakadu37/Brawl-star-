name: Build Discord Manager (.exe)

on:
  push:
    paths:
      - "discord-manager/**"
      - ".github/workflows/build-discord-manager.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: discord-manager
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name DiscordManager --collect-data customtkinter app.py

      - uses: actions/upload-artifact@v4
        with:
          name: DiscordManager
          path: discord-manager/dist/DiscordManager.exe
          if-no-files-found: error
