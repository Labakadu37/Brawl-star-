name: Build Discord Manager

on:
  push:
    paths:
      - "discord-manager/**"
      - ".github/workflows/discord-manager.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: discord-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --onefile --windowed --name DiscordManager app.py
      - uses: actions/upload-artifact@v4
        with:
          name: DiscordManager
          path: discord-manager/dist/DiscordManager.exe
