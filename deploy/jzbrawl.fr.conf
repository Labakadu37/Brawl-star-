# nginx site for https://jzbrawl.fr
# Copy to /etc/nginx/sites-available/jzbrawl.fr, link it into
# sites-enabled, then run: sudo certbot --nginx -d jzbrawl.fr -d www.jzbrawl.fr
server {
    listen 80;
    listen [::]:80;
    server_name jzbrawl.fr www.jzbrawl.fr;

    root /var/www/jzbrawl;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The mod: /var/www/jzbrawl/download/JZS-Brawl.apk
    # Sent as a file download, never cached so a new upload is served at once.
    location ^~ /download/ {
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:webp|png|jpg|svg)$ {
        expires 30d;
    }
}
