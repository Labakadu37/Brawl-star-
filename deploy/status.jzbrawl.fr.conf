# nginx site for https://status.jzbrawl.fr
# Copy to /etc/nginx/sites-available/status.jzbrawl.fr, link it into
# sites-enabled, then run: sudo certbot --nginx -d status.jzbrawl.fr
server {
    listen 80;
    listen [::]:80;
    server_name status.jzbrawl.fr;

    root /var/www/status;
    index index.html;

    # Never cached, so a version change shows up at once.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
