<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DARK AI</title>
<link rel="icon" href="favicon.png">
<style>
  :root {
    --bg: #000;
    --panel: #0b0b0b;
    --line: #1f1f1f;
    --text: #d9d9d9;
    --muted: #6b6b6b;
    --red: #c4161c;
    --red-hi: #ff2a2a;
    --user: #140405;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  header img { width: 34px; height: 34px; border-radius: 50%; }
  header h1 {
    margin: 0; font-size: 18px; letter-spacing: 6px; color: var(--red);
    text-shadow: 0 0 12px rgba(196, 22, 28, .6);
  }
  header .spacer { flex: 1; }
  select, button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--red); }

  #chat { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .wrap { max-width: 820px; margin: 0 auto; }

  #empty { text-align: center; margin-top: 8vh; color: var(--muted); }
  #empty img {
    width: 200px; height: 200px; border-radius: 50%;
    animation: pulse 4s ease-in-out infinite;
  }
  #empty p { letter-spacing: 3px; font-size: 13px; }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(196, 22, 28, .3)); }
    50% { filter: drop-shadow(0 0 28px rgba(255, 42, 42, .7)); }
  }

  .msg { display: flex; gap: 12px; margin-bottom: 22px; }
  .msg .av { width: 30px; height: 30px; flex: none; border-radius: 50%; }
  .msg.user .av { background: #222; display: grid; place-items: center; font-size: 12px; color: var(--muted); }
  .msg .body { min-width: 0; flex: 1; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .body { background: var(--user); border: 1px solid #2a0a0b; padding: 8px 12px; border-radius: 8px; }
  .msg.err .body { color: var(--red-hi); }
  .body pre {
    background: #0d0d0d; border: 1px solid var(--line); border-left: 3px solid var(--red);
    padding: 10px 12px; border-radius: 6px; overflow-x: auto; white-space: pre;
  }
  .body code { font-family: Consolas, "Courier New", monospace; font-size: 13px; }
  .body > code, .body :not(pre) > code { background: #161616; padding: 1px 5px; border-radius: 4px; color: #ff6b6b; }
  .cursor::after { content: "▌"; color: var(--red); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  footer { border-top: 1px solid var(--line); padding: 12px 16px; }
  form { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 200px; min-height: 46px;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px; font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--red); box-shadow: 0 0 0 1px rgba(196, 22, 28, .4); }
  #send { background: var(--red); border-color: var(--red); color: #fff; padding: 12px 18px; font-weight: 600; }
  #send:hover { background: var(--red-hi); }
  #status { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="">
  <h1>DARK</h1>
  <span class="spacer"></span>
  <select id="model" title="Modèle"></select>
  <button id="reset" type="button">Nouveau</button>
</header>

<main id="chat"><div class="wrap" id="log">
  <div id="empty">
    <img src="logo.png" alt="">
    <p>JE T'ÉCOUTE.</p>
  </div>
</div></main>

<footer><div class="wrap">
  <form id="form">
    <textarea id="input" rows="1" placeholder="Parle..." autofocus></textarea>
    <button id="send" type="submit">Envoyer</button>
  </form>
  <div id="status">100 % local — rien ne quitte ton PC.</div>
</div></footer>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), chat = $("chat"), input = $("input"), send = $("send"), status = $("status"), modelSel = $("model");
const empty = $("empty");
let history = [];
let controller = null;

function load() {
  try { history = JSON.parse(localStorage.getItem("dark-history") || "[]"); } catch { history = []; }
}
function save() {
  try { localStorage.setItem("dark-history", JSON.stringify(history)); } catch {}
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function stripThink(s) {
  return s.replace(/<think>[\s\S]*?(<\/think>|$)/g, "").replace(/^\s+/, "");
}
function render(text) {
  const parts = stripThink(text).split(/```/);
  return parts.map((p, i) => {
    if (i % 2) return "<pre><code>" + escapeHtml(p.replace(/^[\w+-]*\n/, "")) + "</code></pre>";
    if (i > 0) p = p.replace(/^\n/, "");
    if (i < parts.length - 1) p = p.replace(/\n$/, "");
    return escapeHtml(p)
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  }).join("");
}

function addMsg(role, text) {
  empty.style.display = "none";
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = role === "user"
    ? '<div class="av">toi</div><div class="body"></div>'
    : '<img class="av" src="logo.png" alt=""><div class="body"></div>';
  const body = el.querySelector(".body");
  if (role === "user") body.textContent = text; else body.innerHTML = render(text);
  log.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return body;
}

function redraw() {
  log.querySelectorAll(".msg").forEach((m) => m.remove());
  empty.style.display = history.length ? "none" : "";
  history.forEach((m) => addMsg(m.role, m.content));
}

async function loadModels() {
  try {
    const r = await fetch("/api/models");
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    const names = data.models.length ? data.models : [data.default];
    modelSel.innerHTML = names.map((n) => `<option>${escapeHtml(n)}</option>`).join("");
    const def = names.find((n) => n === data.default || n.startsWith(data.default + ":"));
    if (def) modelSel.value = def;
  } catch (e) {
    status.textContent = e.message || "Ollama ne répond pas.";
  }
}

async function ask(text) {
  history.push({ role: "user", content: text });
  addMsg("user", text);
  const body = addMsg("assistant", "");
  body.classList.add("cursor");
  send.textContent = "Stop";
  controller = new AbortController();
  let out = "";
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: modelSel.value, messages: history }),
      signal: controller.signal,
    });
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const chunk = JSON.parse(line);
        if (chunk.error) throw new Error(chunk.error);
        out += (chunk.message && chunk.message.content) || "";
      }
      body.innerHTML = render(out);
      chat.scrollTop = chat.scrollHeight;
    }
  } catch (e) {
    if (e.name !== "AbortError") {
      body.parentElement.classList.add("err");
      body.textContent = "Erreur : " + e.message;
    }
  } finally {
    body.classList.remove("cursor");
    send.textContent = "Envoyer";
    controller = null;
    const clean = stripThink(out);
    if (clean) history.push({ role: "assistant", content: clean });
    else if (!body.parentElement.classList.contains("err")) history.pop();
    save();
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (controller) { controller.abort(); return; }
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  input.style.height = "";
  ask(text);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
input.addEventListener("input", () => {
  input.style.height = "";
  input.style.height = input.scrollHeight + "px";
});
$("reset").addEventListener("click", () => {
  if (controller) controller.abort();
  history = [];
  save();
  redraw();
});

load();
redraw();
loadModels();
</script>
</body>
</html>
